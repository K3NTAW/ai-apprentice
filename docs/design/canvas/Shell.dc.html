<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App shell</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
.aa{--bg:#050505;--s1:#121212;--s2:#1C1C1C;--s3:#2A2A2A;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#FFFFFF;--mu:#9E9E9E;--fa:#858585;--ac:#4280FF;--ac2:#7AA6FF;--acs:rgba(66,128,255,.12);--pb:#FFFFFF;--pf:#0A0A0A;--cmp:#1F1F21;--gr:#3FCF8E;--grs:rgba(63,207,142,.14);--rd:#FF6B6B;--rds:rgba(255,107,107,.14);--sh:0 24px 64px rgba(0,0,0,.55);background:var(--bg);color:var(--tx);font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:dark}
.aa *,.aa *::before,.aa *::after{box-sizing:border-box}
.aa h1,.aa h2,.aa h3,.aa p{margin:0}
.t1{font-size:36px;line-height:1.1;letter-spacing:-.025em;font-weight:600}
.sm{font-size:13px}.xs{font-size:12px}.mu{color:var(--mu)}.fa{color:var(--fa)}
.eb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:500}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-family:inherit;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;text-decoration:none;white-space:nowrap;line-height:1}
.bp{background:var(--pb);color:var(--pf)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.av{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex:none;background:var(--s3);color:var(--tx)}
.sk{background:var(--s2);border-radius:8px}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:9px;border:0;background:none;color:var(--tx);font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.mi.on{background:var(--s2)}
.mi:focus-visible{outline:2px solid var(--ac2)}
</style>
</helmet>
<div class="aa" style="position: relative; min-height: 900px; display: flex; flex-wrap: wrap; background: var(--bg)">
<div style="flex: 1 0 248px; border-right: 1px solid var(--ln)">
<dc-import name="Sidebar" active="agents" hint-size="248px,900px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; padding: 36px 40px 48px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 6px"><span class="eb">Finance Ops · Zug</span><h1 class="t1">Agents</h1></div>
<button class="btn bp" type="button"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>New agent</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px">
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><div class="sk" style="height: 168px; border-radius: 12px"></div><div class="sk" style="height: 20px; width: 40%"></div><div class="sk" style="height: 14px; width: 70%"></div><div class="sk" style="height: 44px"></div></div>
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><div class="sk" style="height: 168px; border-radius: 12px"></div><div class="sk" style="height: 20px; width: 50%"></div><div class="sk" style="height: 14px; width: 60%"></div><div class="sk" style="height: 44px"></div></div>
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 14px"><div class="sk" style="height: 168px; border-radius: 12px"></div><div class="sk" style="height: 20px; width: 35%"></div><div class="sk" style="height: 14px; width: 75%"></div><div class="sk" style="height: 44px"></div></div>
</div>
</main>

<div class="card" role="menu" aria-label="Workspaces" style="position: absolute; left: 12px; bottom: 126px; width: 300px; padding: 8px; box-shadow: var(--sh); background: var(--s1); border-color: var(--ln2)">
<div class="xs fa" style="padding: 6px 10px 4px">Workspaces</div>
<button class="mi on" type="button" role="menuitem"><span style="width: 26px; height: 26px; border-radius: 8px; background: #1E3A2F; color: #7EE0B0; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">FO</span><span style="flex: 1">Finance Ops · Zug</span><svg class="ic" viewBox="0 0 24 24" style="color: var(--ac2)"><path d="m5 12 5 5 9-10"></path></svg></button>
<button class="mi" type="button" role="menuitem"><span style="width: 26px; height: 26px; border-radius: 8px; background: #2B2440; color: #C9B8FF; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">SL</span><span style="flex: 1">Sales · Lugano</span><span class="xs fa">3 agents</span></button>
<button class="mi" type="button" role="menuitem"><span style="width: 26px; height: 26px; border-radius: 8px; background: #3A2A1A; color: #FFC98A; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">PL</span><span style="flex: 1">Plant · Brno</span><span class="xs fa">1 agent</span></button>
<div style="height: 1px; background: var(--ln); margin: 6px 4px"></div>
<button class="mi" type="button" role="menuitem" style="color: var(--mu)"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>Create workspace</button>
</div>

<div class="card" role="menu" aria-label="User menu" style="position: absolute; left: 262px; bottom: 16px; width: 260px; padding: 8px; box-shadow: var(--sh); background: var(--s1); border-color: var(--ln2)">
<div style="padding: 8px 10px 10px; display: flex; flex-direction: column"><span class="sm" style="font-weight: 600">Sabine Keller</span><span class="xs mu">sabine.keller@example.com</span></div>
<div style="height: 1px; background: var(--ln); margin: 0 4px 6px"></div>
<button class="mi" type="button" role="menuitem"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"></path></svg>Profile</button>
<button class="mi" type="button" role="menuitem"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"></path></svg>Theme<span class="xs fa" style="margin-left: auto">Dark</span></button>
<button class="mi" type="button" role="menuitem"><svg class="ic" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>Keyboard shortcuts</button>
<button class="mi" type="button" role="menuitem"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6z"></path></svg>Privacy and capture</button>
<div style="height: 1px; background: var(--ln); margin: 6px 4px"></div>
<button class="mi" type="button" role="menuitem" style="color: var(--mu)"><svg class="ic" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg>Sign out</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
