<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agents, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
.aa{--bg:#050505;--s1:#121212;--s2:#1C1C1C;--s3:#2A2A2A;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#FFFFFF;--mu:#9E9E9E;--fa:#858585;--ac:#4280FF;--ac2:#7AA6FF;--acs:rgba(66,128,255,.12);--pb:#FFFFFF;--pf:#0A0A0A;--cmp:#1F1F21;--gr:#3FCF8E;--grs:rgba(63,207,142,.14);background:var(--bg);color:var(--tx);font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:dark}
.aa *,.aa *::before,.aa *::after{box-sizing:border-box}
.aa h1,.aa h2,.aa p{margin:0}
.t1{font-size:30px;line-height:1.1;letter-spacing:-.025em;font-weight:600}
.sm{font-size:13px}.xs{font-size:12px}.mu{color:var(--mu)}.fa{color:var(--fa)}
.eb{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);font-weight:500}
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px}
.aa a.card{color:var(--tx);text-decoration:none}
.bdg{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1}
.bdg::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.k-ok{background:var(--grs);color:var(--gr)}.k-ac{background:var(--acs);color:var(--ac2)}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;height:56px;justify-content:center;color:var(--fa);font-size:11px;font-weight:500;text-decoration:none}
.aa a.tb{color:var(--fa)}.aa a.tb.on{color:var(--tx)}
</style>
</helmet>
<div class="aa" style="position: relative; width: 390px; min-height: 1500px; background: var(--bg); padding-bottom: 96px">
<header style="padding: 14px 20px; display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 10px"><span style="width: 32px; height: 32px; border-radius: 9px; background: #1E3A2F; color: #7EE0B0; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">FO</span><span style="display: flex; flex-direction: column"><span class="sm" style="font-weight: 600; line-height: 1.2">Finance Ops</span><span class="xs mu" style="line-height: 1.2">Zug</span></span></span>
<a href="NewAgent.dc.html" aria-label="New agent" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #0A0A0A; display: inline-flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></a>
</header>
<div style="padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 6px">
<h1 class="t1">Agents</h1>
<p class="mu">Each one learns from one expert.</p>
</div>
<div style="padding: 0 20px; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{ agents }}" as="a" hint-placeholder-count="5">
<a class="card" href="Agent.dc.html" style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; gap: 14px; align-items: center">
<div style="width: 84px; height: 84px; border-radius: 14px; background: linear-gradient(180deg, #232327 0%, #0A0A0C 100%); display: flex; align-items: center; justify-content: center; flex: none">
<dc-import name="Avatar" shape="{{a.shape}}" face="{{a.face}}" tone="{{a.tone}}" accent="{{a.accent}}" mood="{{a.mood}}" size="68" hint-size="68px,68px"></dc-import>
</div>
<div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 19px; font-weight: 600; letter-spacing: -0.015em">{{a.nm}}</span>
<span class="sm mu">{{a.role}}</span>
<span class="xs fa">learns from {{a.expert}}</span>
<span class="{{a.statusCls}}" style="margin-top: 6px; align-self: flex-start">{{a.status}}</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding-top: 10px; border-top: 1px solid var(--ln)">
<span style="display: flex; flex-direction: column"><span class="mono" style="font-weight: 600">{{a.p}}</span><span class="xs fa">Processes</span></span>
<span style="display: flex; flex-direction: column"><span class="mono" style="font-weight: 600">{{a.s}}</span><span class="xs fa">Shortcuts</span></span>
<span style="display: flex; flex-direction: column"><span class="mono" style="font-weight: 600">{{a.g}}</span><span class="xs fa">Guardrails</span></span>
<span style="display: flex; flex-direction: column"><span class="mono" style="font-weight: 600">{{a.l}}</span><span class="xs fa">Learners</span></span>
</div>
</a>
</sc-for>
<a class="card" href="NewAgent.dc.html" style="padding: 18px; display: flex; align-items: center; gap: 14px; border-style: dashed; border-color: var(--ln2); background: transparent">
<span style="width: 44px; height: 44px; border-radius: 50%; background: var(--s2); color: var(--ac2); display: inline-flex; align-items: center; justify-content: center"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 600">New agent</span><span class="xs mu">Name it, give it a face, train it.</span></span>
</a>
</div>
<nav aria-label="App" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding: 0 12px 8px; display: flex; border-top: 1px solid var(--ln); background: var(--s1)">
<a class="tb on" href="Gallery.dc.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="6"></rect><circle cx="9" cy="11" r=".8"></circle><circle cx="15" cy="11" r=".8"></circle><path d="M9.5 15c1.5 1 3.5 1 5 0"></path></svg>Agents</a>
<a class="tb" href="Learn.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7.5 12 4l9 3.5-9 3.5z"></path><path d="M7 9.5V15c0 1.5 2.5 3 5 3s5-1.5 5-3V9.5"></path></svg>Learn</a>
<a class="tb" href="Workspace.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"></path><path d="M16 5.5a3 3 0 0 1 0 5.5M18 14c2 .6 3 2.2 3 5"></path></svg>Workspace</a>
<a class="tb" href="Shell.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c0-4 3.6-6 8-6s8 2 8 6"></path></svg>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    const ready = 'bdg k-ok';
    return {
      agents: [
        { nm: 'Pip', role: 'Senior AP Clerk', expert: 'Sabine Keller', shape: 'blob', face: 'smile', tone: '#ECEAE5', accent: '#3A4EFD', mood: 'idle', p: 6, s: 23, g: 14, l: 3, status: 'Ready to teach', statusCls: ready },
        { nm: 'Juno', role: 'Senior Sales Person', expert: 'Marco Bianchi', shape: 'bean', face: 'wink', tone: '#F3A150', accent: '#62A9F3', mood: 'idle', p: 4, s: 11, g: 9, l: 2, status: 'Ready to teach', statusCls: ready },
        { nm: 'Otto', role: 'Plant Controller', expert: 'Urs Gerber', shape: 'square', face: 'focus', tone: '#65D9A5', accent: '#A27DF8', mood: 'idle', p: 3, s: 17, g: 8, l: 1, status: 'Ready to teach', statusCls: ready },
        { nm: 'Nova', role: 'Payroll Specialist', expert: 'Brigitte Roth', shape: 'round', face: 'calm', tone: '#A27DF8', accent: '#E775C0', mood: 'listening', p: 2, s: 6, g: 11, l: 0, status: 'Training now', statusCls: 'bdg k-ac' },
        { nm: 'Bolt', role: 'IT Service Desk Lead', expert: 'Reto Frei', shape: 'pill', face: 'robot', tone: '#F3C354', accent: '#3A4EFD', mood: 'idle', p: 5, s: 31, g: 6, l: 4, status: 'Ready to teach', statusCls: ready }
      ]
    };
  }
}
</script>
</body>
</html>
