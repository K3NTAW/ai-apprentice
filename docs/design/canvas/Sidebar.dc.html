<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
.aa{--bg:#050505;--s1:#121212;--s2:#1C1C1C;--s3:#2A2A2A;--ln:rgba(255,255,255,.08);--ln2:rgba(255,255,255,.14);--tx:#FFFFFF;--mu:#9E9E9E;--fa:#858585;--ac:#4280FF;--gr:#3FCF8E;background:var(--bg);color:var(--tx);font-family:Geist,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:dark}
.aa.lt{--bg:#FFFFFF;--s1:#F7F7F7;--s2:#F0F0F0;--s3:#E4E4E4;--ln:rgba(0,0,0,.08);--ln2:rgba(0,0,0,.14);--tx:#0A0A0A;--mu:#5E5E5E;--fa:#757575;--ac:#1F5FFF;--gr:#13784B;color-scheme:light}
.aa *,.aa *::before,.aa *::after{box-sizing:border-box}
.sm{font-size:13px}.xs{font-size:12px}.mu{color:var(--mu)}.fa{color:var(--fa)}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:999px;color:var(--mu);text-decoration:none;font-weight:500}
.aa a.nav{color:var(--mu)}.aa a.nav.on{background:var(--s2);color:var(--tx)}
.nav:focus-visible,.rb:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.rb{display:flex;flex-direction:column;gap:1px;padding:8px 12px;border-radius:14px;color:var(--tx);text-decoration:none}
.aa a.rb{color:var(--tx)}
.av{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;flex:none}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:6px;border:1px solid var(--ln2);font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;color:var(--fa);line-height:1}
</style>
</helmet>
<div class="aa {{lt}}" style="width: 100%; min-height: 900px; padding: 16px 12px; display: flex; flex-direction: column; gap: 14px; background: var(--bg)">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 8px">
<a href="Gallery.dc.html" aria-label="AI Apprentice home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tx); font-weight: 600; font-size: 15px; letter-spacing: -0.01em">
<svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true" style="color: var(--tx)"><rect width="28" height="28" rx="9" fill="currentColor"></rect><circle cx="11" cy="14" r="5" style="fill: var(--bg)"></circle><circle cx="19.5" cy="17" r="3" style="fill: var(--bg)" opacity=".75"></circle></svg>
apprentice</a>
<button type="button" aria-label="Collapse sidebar" style="width: 32px; height: 32px; border-radius: 50%; border: 0; background: transparent; color: var(--fa); display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"></rect><path d="M9 4v16"></path></svg></button>
</div>

<button type="button" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--ln); background: transparent; color: var(--fa); font-family: inherit; font-size: 14px; cursor: pointer; text-align: left">
<svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span style="flex: 1">Search</span><span class="kc">⌘K</span>
</button>

<nav style="display: flex; flex-direction: column; gap: 2px" aria-label="App">
<a class="{{c.agents}}" href="Gallery.dc.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="6"></rect><circle cx="9" cy="11" r=".8"></circle><circle cx="15" cy="11" r=".8"></circle><path d="M9.5 15c1.5 1 3.5 1 5 0"></path></svg>Agents</a>
<a class="{{c.learn}}" href="Learn.dc.html"><svg class="ic" viewBox="0 0 24 24"><path d="M3 7.5 12 4l9 3.5-9 3.5z"></path><path d="M7 9.5V15c0 1.5 2.5 3 5 3s5-1.5 5-3V9.5"></path></svg>Learn</a>
<a class="{{c.workspace}}" href="Workspace.dc.html"><svg class="ic" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"></circle><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"></path><path d="M16 5.5a3 3 0 0 1 0 5.5M18 14c2 .6 3 2.2 3 5"></path></svg>Workspace</a>
<a class="{{c.install}}" href="NewAgent3.dc.html"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M2 20h20M12 7v6M9.5 10.5 12 13l2.5-2.5"></path></svg>Install companion</a>
</nav>

<div style="display: flex; flex-direction: column; gap: 2px; padding-top: 6px">
<span class="xs fa" style="padding: 0 12px 6px">Today</span>
<a class="rb" href="Capture.dc.html"><span class="sm" style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Training Pip · supplier invoices</span><span class="xs fa" style="display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF6B6B"></span>live · 12:48</span></a>
<a class="rb" href="Debrief.dc.html"><span class="sm" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Debrief · Czech approvals</span><span class="xs fa">Pip · 11:20</span></a>
<span class="xs fa" style="padding: 10px 12px 6px">Yesterday</span>
<a class="rb" href="Teach.dc.html"><span class="sm" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Lena learns supplier invoices</span><span class="xs fa">Pip · 5 of 7 mastered</span></a>
<a class="rb" href="WorkMap.dc.html"><span class="sm" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Work Map · duplicate check</span><span class="xs fa">Pip · confirmed</span></a>
<span class="xs fa" style="padding: 10px 12px 6px">Earlier</span>
<a class="rb" href="Agent.dc.html"><span class="sm" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Juno · quote follow-up</span><span class="xs fa">Marco · 2026-09-27</span></a>
</div>

<div style="flex: 1"></div>

<button type="button" aria-label="Switch workspace" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--mu); font-family: inherit; font-size: 13px; cursor: pointer; text-align: left">
<span style="width: 20px; height: 20px; border-radius: 6px; background: var(--s3); color: var(--tx); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600">FO</span><span style="flex: 1">Finance Ops · Zug</span>
<svg class="ic" viewBox="0 0 24 24" style="width: 14px; height: 14px"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>

<button type="button" aria-label="Open user menu" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--ln); background: var(--s1); color: var(--tx); font-family: inherit; text-align: left; cursor: pointer">
<span class="av" style="background: {{u.bg}}; color: {{u.fg}}">{{u.ini}}</span>
<span style="display: flex; flex-direction: column; min-width: 0; flex: 1"><span class="sm" style="font-weight: 600; line-height: 1.2">{{u.nm}}</span><span class="xs fa" style="line-height: 1.3; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--gr)"></span>companion paired</span></span>
<svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px; color: var(--fa)"><path d="m8 9 4-4 4 4M8 15l4 4 4-4"></path></svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["agents","learn","workspace","install"],"default":"agents"},"user":{"editor":"enum","options":["sabine","lena"],"default":"sabine"},"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active || 'agents';
    const lena = this.props.user === 'lena';
    const c = {};
    ['agents', 'learn', 'workspace', 'install'].forEach((k) => { c[k] = k === a ? 'nav on' : 'nav'; });
    const u = lena
      ? { ini: 'LG', nm: 'Lena Graf', bg: '#2B2440', fg: '#C9B8FF' }
      : { ini: 'SK', nm: 'Sabine Keller', bg: '#3A2A1A', fg: '#FFC98A' };
    return { c, u, lt: this.props.theme === 'light' ? 'lt' : '' };
  }
}
</script>
</body>
</html>
