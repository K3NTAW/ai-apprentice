<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>AI Apprentice</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0b0c; color: #e7e7ea; font: 15px/1.5 -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 520px; padding: 24px; }
      code { background: #1c1c20; padding: 1px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Apprentice cannot start</h1>
      <p>The control room address is not valid. Set <code>APP_URL</code> to an https URL, or fix
        <code>appUrl</code> in <code>app.config.json</code> or the stored <code>app-url.json</code> in the app's
        user data folder, then restart the app.</p>
      <p>The reason is in the app log (<code>APP_URL invalid: …</code>).</p>
    </main>
  </body>
</html>
