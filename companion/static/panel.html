<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'" />
    <title>AI Apprentice companion</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="brand"><span class="orb"></span>AI Apprentice</span>
      <span id="state" class="state"></span>
      <button id="hide" class="icon" type="button" title="Hide">×</button>
    </header>

    <section id="pairing" class="card">
      <div class="label">Pairing code</div>
      <div id="code" class="code"></div>
      <p class="muted">Enter this code in the control room to connect.</p>
      <button id="new-code" type="button">New code</button>
    </section>

    <section id="session" class="card">
      <div class="row"><span id="mode" class="pill"></span><span id="offrec" class="pill warn hidden">Off the record</span><span id="paused" class="pill hidden">Paused</span></div>
      <div id="title" class="title"></div>
      <div id="expert" class="muted"></div>
      <div class="qa"><div class="label">Last question</div><div id="question" class="text"></div></div>
      <div class="qa"><div class="label">Last answer</div><div id="answer" class="text"></div></div>
      <div class="row counters"><span>Questions <b id="asked">0</b></span><span>Guardrails <b id="guardrails">0</b></span></div>
      <div class="row buttons">
        <button data-action="pause_toggle" type="button">Pause</button>
        <button data-action="off_record_toggle" type="button">Off the record</button>
        <button data-action="end_task" type="button" class="danger">End task</button>
      </div>
      <button id="control-room" type="button" class="link">Open control room</button>
    </section>

    <section id="permissions" class="card hidden">
      <div class="label">macOS permissions</div>
      <div id="missing" class="stack"></div>
    </section>

    <section class="card">
      <div class="label">Shortcuts</div>
      <div id="talk-hint" class="muted"></div>
      <div id="shortcuts" class="stack"></div>
      <div class="row">
        <button id="reset" type="button" class="link">Reset to defaults</button>
        <label class="toggle"><input id="buddy" type="checkbox" /> Cursor buddy</label>
      </div>
      <div id="buddy-forced" class="muted hidden">Buddy is off (COMPANION_BUDDY): halos only.</div>
    </section>
    <script src="panel.js"></script>
  </body>
</html>
