<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src data:" />
    <title>AI Apprentice agent</title>
    <link rel="stylesheet" href="canvas.css" />
    <link rel="stylesheet" href="dock.css" />
  </head>
  <body class="gl">
    <main id="dock" class="dock" aria-label="AI Apprentice side dock">
      <button id="tab" class="glass tab" type="button" title="Expand" aria-label="Expand AI Apprentice dock">
        <svg class="ic chev" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg>
        <span class="tile tab-tile"><img id="tab-avatar" class="avatar-sm" alt="" draggable="false" /></span>
        <span class="tab-meta"><span id="tab-rec" class="rec"></span><span id="tab-asked" class="mono xs count hidden">0</span></span>
      </button>
      <section id="full" class="glass full">
        <div class="top">
          <span id="header" class="xs mu"></span>
          <span class="grow"></span>
          <span id="rec-pill" class="pill xs mono recpill"><span id="rec" class="rec"></span><span id="rec-label">on</span><span id="timer" class="timer hidden"></span></span>
          <button id="collapse" class="btn bw sq" type="button" title="Collapse" aria-label="Collapse dock"><svg class="ic" viewBox="0 0 24 24"><path id="chev" d="m9 6 6 6-6 6"></path></svg></button>
        </div>
        <div id="offrec" class="pill offcard hidden">
          <svg class="ic" viewBox="0 0 24 24"><path d="M3 3l18 18"></path><path d="M10.6 6.1A10 10 0 0 1 12 6c5 0 9 6 9 6a17 17 0 0 1-3 3.5M6.6 6.6C4.2 8.2 3 12 3 12s4 6 9 6c1.6 0 3-.4 4.3-1"></path></svg>
          <span class="col"><span class="strong">Off the record · nothing is captured</span><span class="xs mu">no screen, no audio, no keys</span></span>
        </div>
        <header class="head">
          <span class="tile avatar-tile"><img id="avatar" class="avatar" alt="" draggable="false" /></span>
          <div class="who">
            <div id="name" class="name"></div>
            <div id="role" class="xs mu role"></div>
            <div id="state" class="xs state"><span class="dot"></span><span id="state-label"></span></div>
          </div>
        </header>
        <div id="say" class="pill say hidden">
          <span class="xs mu">asked at a pause</span><p id="say-text"></p>
          <span class="xs mu hint">answer out loud, or hold <kbd class="kc">⌃</kbd><kbd class="kc">⌥</kbd></span>
        </div>
        <div class="learned"><span class="eb">what i learned</span><span class="xs fa">this task</span></div>
        <ul id="feed" class="feed"></ul>
        <div class="counters">
          <span><span id="asked" class="mono num">0</span><span class="xs fa">asked</span></span>
          <span><span id="guardrails" class="mono num">0</span><span class="xs fa">guardrails</span></span>
        </div>
        <div class="buttons">
          <button data-action="pause_toggle" type="button" class="btn bw sq" title="Pause" aria-label="Pause"><svg class="ic" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"></path></svg></button>
          <button id="off-btn" data-action="off_record_toggle" type="button" class="btn bw grow"><span id="off-dot" class="offdot hidden"></span><span id="off-label">Off the record</span></button>
          <button id="end-btn" data-action="end_task" type="button" class="btn bk">End task</button>
        </div>
      </section>
    </main>
    <script src="avatarSrc.js"></script>
    <script src="dock.js"></script>
  </body>
</html>
