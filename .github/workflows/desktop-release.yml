# Desktop release (T-0363): builds, signs and notarizes the macOS companion and uploads a DRAFT release to
# K3NTAW/ai-apprentice-desktop. Run by hand from the default branch only. Human steps: docs/RELEASE.md.
# Guarded by e2e/desktop-release.guard.test.ts. Secrets are read only inside env: blocks, never in run: text.
name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, equal to companion/package.json version (for example 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Refuse to run off the default branch
        if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          echo "::error::Run this workflow from the default branch (got $GITHUB_REF)."
          exit 1

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::Version is not semver: $VERSION"
            exit 1
          fi
          pkg=$(node -p "require('./companion/package.json').version")
          if [ "$VERSION" != "$pkg" ]; then
            echo "::error::Version $VERSION does not match companion/package.json version $pkg. Bump it on a branch and merge first."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Install companion dependencies
        run: npm --prefix companion ci

      - name: Write the App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build and write the release config
        env:
          SENTRY_DSN_ELECTRON: ${{ secrets.SENTRY_DSN_ELECTRON }}
        run: |
          npm --prefix companion run build
          node companion/dist/writeReleaseConfig.mjs

      - name: Package, sign and notarize
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm --prefix companion run package:signed

      - name: Upload a draft release
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes "Draft; see docs/RELEASE.md" --repo K3NTAW/ai-apprentice-desktop companion/release/*.dmg companion/release/*.zip companion/release/*.blockmap companion/release/latest-mac.yml

      - name: Remove the API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
